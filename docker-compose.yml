services:
  observatorio-scraping:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: observatorio_digital_scraping
    init: true
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LLM_PROVIDER=ollama
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=gemma3:1b
      - OLLAMA_STARTUP_RETRIES=10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.sessions:/app/.sessions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
