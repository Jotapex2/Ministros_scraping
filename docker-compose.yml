services:
  observatorio-scraping:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: observatorio_digital_scraping
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:4b
      - OLLAMA_STARTUP_RETRIES=10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.sessions:/app/.sessions
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://127.0.0.1:3000'),fetch(process.env.OLLAMA_HOST + '/api/tags')]).then(r=>{if(r.some(x=>!x.ok))process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
